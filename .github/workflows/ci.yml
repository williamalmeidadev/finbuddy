name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finbuddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finbuddy
      JWT_SECRET: ci-ephemeral-jwt-secret-key-32-chars-long
      PORT: 3000
      RECURRING_TRANSACTION_AUTOMATION_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma Schema
        run: npm run prisma:validate

      - name: Run Workspace Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Run AI Deterministic Evaluations
        run: npm run test:api:eval

      - name: Run E2E Tests
        run: npm run test:api:e2e

      - name: Build All Workspaces
        run: npm run build
